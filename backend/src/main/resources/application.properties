spring.application.name=lune-backend

# Hosts like Railway assign the port through $PORT.
server.port=${PORT:8080}

# TLE API for satellite catalog and propagation (https://tle.ivanstanojevic.me/)
lune.tle-api.base-url=https://tle.ivanstanojevic.me

# Python FastAPI analytics (see /analytics-service); override with LUNE_ANALYTICS_BASE_URL
lune.analytics.base-url=${LUNE_ANALYTICS_BASE_URL:http://127.0.0.1:8000}

# Whole-group satellite lists (e.g. Starlink) are a few MB of JSON; gzip cuts that substantially.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2048

# TLE catalog disk cache (see SatelliteCatalog); defaults to ~/.lune/tle-cache
# lune.catalog.cache-dir=/path/to/tle-cache
